services:
  uzdi_db:
    image: postgres:15-alpine
    container_name: uzdi_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: uzdi_db
    ports:
      - "${UZDI_DB_PORT:-5432}:5432"
    volumes:
      - uzdi_pgdata:/var/lib/postgresql/data
      # Montaje automático del script DDL v8 en la inicialización de Postgres
      - './Back Ecologia (1).sql:/docker-entrypoint-initdb.d/01_ddl_v8.sql:ro'
      # Tabla persona-perfil, usuario admin inicial y matriz RBAC (seguridad.accn / seguridad.prms)
      - './db/02_seguridad_rbac.sql:/docker-entrypoint-initdb.d/02_seguridad_rbac.sql:ro'
      # Catálogos iniciales y datos operativos (provincias, cantones, uzdis, infracciones, medidas, etc.)
      - './db/03_datos_iniciales_catalogos.sql:/docker-entrypoint-initdb.d/03_datos_iniciales_catalogos.sql:ro'
    networks:
      - uzdi_network

volumes:
  uzdi_pgdata:
    driver: local

networks:
  uzdi_network:
    driver: bridge

