# /etc/nginx/sites-available/uzdi-api  →  ln -s a sites-enabled
# Proxy inverso: Internet (80/443) → API NestJS en 127.0.0.1:3000
# HTTPS: sudo certbot --nginx -d api.uzdi.ejemplo.gob.ec

upstream uzdi_api {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.uzdi.ejemplo.gob.ec;   # o la IP del servidor

    client_max_body_size 20m;   # documentos adjuntos de expedientes

    # Cabeceras de seguridad básicas
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    location / {
        proxy_pass http://uzdi_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;   # reportes PDF/Excel grandes
    }

    access_log /var/log/nginx/uzdi-api.access.log;
    error_log  /var/log/nginx/uzdi-api.error.log;
}
