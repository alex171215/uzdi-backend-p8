services:
  - type: web
    name: uzdi-backend-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /api/v1
    envVars:
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        value: '*'
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: uzdi-postgres-db
          property: connectionString

databases:
  - name: uzdi-postgres-db
    databaseName: uzdi_db
    user: uzdi_user
    plan: free
    region: oregon
